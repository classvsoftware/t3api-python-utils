site_name: t3api-utils
site_description: Secret-key auth, collection loading, reports and tag lists for the T3 API
site_url: https://classvsoftware.github.io/t3api-python-utils/
repo_url: https://github.com/classvsoftware/t3api-python-utils
repo_name: classvsoftware/t3api-python-utils
edit_uri: edit/master/docs/
copyright: GPL-3.0-only · Track & Trace Tools
exclude_docs: |
  _ext/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            extensions:
              - docs/_ext/griffe_roles.py:SphinxRoles
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            show_if_no_docstring: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Authentication: guide/authentication.md
      - Endpoints and the spec: guide/endpoints-and-spec.md
      - Collections: guide/collections.md
      - Writes: guide/writes.md
      - Reports and tag lists: guide/reports-and-tag-lists.md
      - Local data: guide/local-data.md
      - The t3api command: guide/cli.md
      - Errors and logging: guide/errors-and-logging.md
  - Migrating from 1.x: migration.md
  - Reference:
      - T3Client: reference/client.md
      - connect() and auth: reference/auth.md
      - Writes: reference/writes.md
      - Reports: reference/reports.md
      - Tag lists: reference/tag-lists.md
      - Local data: reference/local.md
      - Errors: reference/errors.md
      - Spec: reference/spec.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn
