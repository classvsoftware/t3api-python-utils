[project]
name = "t3api-utils"
version = "2.0.1"
description = "Secret-key auth, collection loading, reports and tag lists for the T3 API"
authors = [{ name = "Matt Frisbie", email = "matt@classvsoftware.com" }]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
keywords = ["t3", "metrc", "track and trace", "cannabis", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.16",
    "rich>=13.0",
    "typer>=0.16",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pyotp>=2.8",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
tui = ["textual>=6.0"]

[project.scripts]
t3api = "t3api_utils.cli:app"

[project.urls]
Homepage = "https://github.com/classvsoftware/t3api-python-utils"
Documentation = "https://classvsoftware.github.io/t3api-python-utils/"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "t3api_utils"
module-root = ""

[dependency-groups]
dev = [
    "textual>=6.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.27",
]

[tool.mypy]
files = ["t3api_utils", "tests", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyotp", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sandbox: live tests against the T3 sandbox; need T3_SMOKE_SECRET_KEY",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["t3api_utils"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
