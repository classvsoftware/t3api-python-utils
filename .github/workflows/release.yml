# Publishes t3api-utils to PyPI when a GitHub release is published.
#
# BEFORE THIS CAN WORK, enable trusted publishing on PyPI:
#   https://pypi.org/manage/project/t3api-utils/settings/publishing/
#   Add a GitHub publisher with owner "classvsoftware", repository
#   "t3api-python-utils", workflow "release.yml" and environment "pypi".
# Also create the "pypi" environment under the repository's Settings >
# Environments (optionally with required reviewers). Until both exist, the
# publish job fails at the upload step and nothing is released.
#
# Release checklist: bump the version in pyproject.toml, update CHANGELOG.md,
# run scripts/update_spec.py and the sandbox smoke tests, then publish a
# GitHub release whose tag matches the version (e.g. v2.0.0).

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match pyproject version $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/t3api-utils/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
